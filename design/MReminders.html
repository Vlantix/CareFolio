<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CareFolio — Reminders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Schibsted+Grotesk:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6E69}a:hover{color:#08524E}
@keyframes cf-enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cf-enter{animation:cf-enter .4s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){.cf-enter{animation:none}}
</style>
</helmet>
<div class="cf-enter" style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6F5; font-family: 'Figtree', system-ui, sans-serif; color: #10292C; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D4DFDD; display: flex; align-items: center; justify-content: center; color: #10292C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <h1 style="flex: 1; margin: 0; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 22px">Reminders</h1>
    <span style="font-size: 12px; font-weight: 700; color: #4B6164">Optional</span>
  </div>
  <section style="background: #FFFFFF; border: 1px solid #D4DFDD; border-radius: 18px; padding: 4px 16px">
    <sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
      <label style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #E6EDEC">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px">{{t.label}}</strong><span style="font-size: 13px; color: #4B6164">{{t.hint}}</span></span>
        <input type="checkbox" checked="{{t.on}}" onChange="{{t.toggle}}" style="width: 22px; height: 22px; accent-color: #0B6E69">
      </label>
    </sc-for>
  </section>
  <h2 style="margin: 4px 0 0; font-size: 13px; font-weight: 700; color: #4B6164; letter-spacing: 0.05em; text-transform: uppercase">Coming up</h2>
  <article style="display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #D4DFDD">
    <span style="width: 52px; height: 56px; border-radius: 12px; background: #0B6E69; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 11px; font-weight: 700">OCT</span><strong style="font-size: 20px">15</strong></span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong>Check-up · [Doctor name]</strong><span style="font-size: 13px; color: #4B6164">[Clinic] · 10:00 AM</span></span>
  </article>
  <article style="display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #D4DFDD">
    <span style="width: 52px; height: 56px; border-radius: 12px; background: #FDF0E1; color: #8A4209; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 11px; font-weight: 700">OCT</span><strong style="font-size: 20px">18</strong></span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong>Refill · [Medication 1]</strong><span style="font-size: 13px; color: #4B6164">About 3 days of supply left</span></span>
  </article>
  <article style="display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #D4DFDD">
    <span style="width: 52px; height: 56px; border-radius: 12px; background: #E8EEF7; color: #24467A; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 11px; font-weight: 700">NOV</span><strong style="font-size: 20px">02</strong></span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong>Lab test · Creatinine</strong><span style="font-size: 13px; color: #4B6164">Fasting not required</span></span>
  </article>
  <div style="flex-grow: 1"></div>
  <a href="#" style="display: flex; align-items: center; justify-content: center; height: 54px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #0B6E69; color: #0B6E69; font-weight: 700; font-size: 16px; text-decoration: none">Add a reminder</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { appt: true, refill: true, lab: false };
  }
  renderVals() {
    const t = [['appt', 'Appointments', 'A day before and 2 hours before'], ['refill', 'Medicine refills', 'When supply runs low'], ['lab', 'Scheduled lab tests', 'Morning of the test']];
    return { toggles: t.map(([k, label, hint]) => ({ label, hint, on: this.state[k], toggle: () => this.setState({ [k]: !this.state[k] }) })) };
  }
}
</script>
</body>
</html>
