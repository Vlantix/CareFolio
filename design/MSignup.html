<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CareFolio — Sign up (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Schibsted+Grotesk:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6E69}a:hover{color:#08524E}
@keyframes cf-enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cf-enter{animation:cf-enter .4s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){.cf-enter{animation:none}}
</style>
</helmet>
<div class="cf-enter" style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6F5; font-family: 'Figtree', system-ui, sans-serif; color: #10292C; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Back to log in" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D4DFDD; display: flex; align-items: center; justify-content: center; color: #10292C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <span style="font-size: 13px; font-weight: 600; color: #4B6164; letter-spacing: 0.04em; text-transform: uppercase">Step 1 of 2 · Account</span>
    <span style="width: 44px"></span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 28px; letter-spacing: -0.02em">Create your account</h1>
    <p style="margin: 0; font-size: 15px; color: #4B6164">For patients and family caregivers.</p>
  </div>
  <fieldset style="border: 0; margin: 0; padding: 0">
    <legend style="font-size: 14px; font-weight: 600; margin-bottom: 8px">I am…</legend>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; border-radius: 12px; border: 1.5px solid #C5D3D1; background: #FFFFFF; font-size: 15px; font-weight: 600"><input type="radio" name="role" style="accent-color: #0B6E69; width: 18px; height: 18px; margin: 0">The patient</label>
      <label style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; border-radius: 12px; border: 2px solid #0B6E69; background: #E3F1EF; font-size: 15px; font-weight: 600"><input type="radio" name="role" checked style="accent-color: #0B6E69; width: 18px; height: 18px; margin: 0">A caregiver</label>
    </div>
  </fieldset>
  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 5px"><label for="su-name" style="font-size: 14px; font-weight: 600">Full name</label><input id="su-name" placeholder="As shown on your valid ID" style="height: 48px; box-sizing: border-box; border: 1.5px solid #C5D3D1; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; background: #FFFFFF"></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 5px"><label for="su-email" style="font-size: 14px; font-weight: 600">Email</label><input id="su-email" type="email" placeholder="you@email.com" style="height: 48px; min-width: 0; box-sizing: border-box; border: 1.5px solid #C5D3D1; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; background: #FFFFFF"></div>
      <div style="display: flex; flex-direction: column; gap: 5px"><label for="su-phone" style="font-size: 14px; font-weight: 600">Mobile no.</label><input id="su-phone" type="tel" placeholder="09XX XXX XXXX" style="height: 48px; min-width: 0; box-sizing: border-box; border: 1.5px solid #C5D3D1; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; background: #FFFFFF"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 5px"><label for="su-pass" style="font-size: 14px; font-weight: 600">Password</label><input id="su-pass" type="password" placeholder="At least 8 characters" style="height: 48px; box-sizing: border-box; border: 1.5px solid #C5D3D1; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; background: #FFFFFF"></div>
    <div style="display: flex; flex-direction: column; gap: 5px"><label for="su-hosp" style="font-size: 14px; font-weight: 600">Patient's hospital no. <span style="font-weight: 400; color: #4B6164">(optional)</span></label><input id="su-hosp" placeholder="Helps the records office match you" style="height: 48px; box-sizing: border-box; border: 1.5px solid #C5D3D1; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; background: #FFFFFF"></div>
    <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1.5px dashed #8FA3A5; background: #FFFFFF; font: inherit; text-align: left; color: #10292C">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B6E69" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M6 16c.8-1.5 1.8-2 3-2s2.2.5 3 2M14 10h4M14 13h3"></path></svg>
      <span style="display: flex; flex-direction: column"><strong style="font-size: 14px">Add a photo of your valid ID</strong><span style="font-size: 13px; color: #4B6164">Checked by the records office before activation</span></span>
    </button>
  </div>
  <div style="flex-grow: 1"></div>
  <a href="Otp.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #0B6E69; color: #FFFFFF; font-weight: 600; font-size: 17px; text-decoration: none">Create account &amp; get email code</a>
  <p style="margin: 0; text-align: center; font-size: 14px; color: #4B6164">Already have an account? <a href="Main.dc.html" style="font-weight: 600">Log in</a></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
