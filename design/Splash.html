<style>
body{margin:0}
a{color:#7FE0D6}a:hover{color:#FFFFFF}
@keyframes cf-mark-in{0%{opacity:0;transform:scale(.55) rotate(-120deg)}60%{opacity:1;transform:scale(1.08) rotate(8deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes cf-glow{0%{transform:scale(.9);opacity:0}40%{opacity:.55}100%{transform:scale(1.6);opacity:0}}
@keyframes cf-word-in{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@keyframes cf-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes cf-fill{from{width:0}to{width:100%}}
.cf-mark{animation:cf-mark-in .9s cubic-bezier(.2,.8,.2,1) both}
.cf-glow{animation:cf-glow 2.4s ease-out .7s infinite}
.cf-word{animation:cf-word-in .7s cubic-bezier(.4,0,.2,1) .7s both}
.cf-tag{animation:cf-rise .6s ease-out 1.3s both}
.cf-bar{animation:cf-fill 1.6s cubic-bezier(.4,0,.2,1) 1.4s both}
.cf-go{animation:cf-rise .5s ease-out 3s both}
@media (prefers-reduced-motion: reduce){.cf-mark,.cf-glow,.cf-word,.cf-tag,.cf-bar,.cf-go{animation:none}}
</style>
