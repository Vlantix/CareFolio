<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CareFolio — Share with a doctor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Schibsted+Grotesk:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6E69}a:hover{color:#08524E}
@keyframes cf-enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cf-enter{animation:cf-enter .4s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){.cf-enter{animation:none}}
</style>
</helmet>
<div class="cf-enter" style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6F5; font-family: 'Figtree', system-ui, sans-serif; color: #10292C; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D4DFDD; display: flex; align-items: center; justify-content: center; color: #10292C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 22px">Share with a doctor</h1>
  </div>
  <div style="background: #FFFFFF; border: 1px solid #D4DFDD; border-radius: 20px; padding: 16px; display: flex; gap: 16px; align-items: center">
    <svg width="132" height="132" viewBox="0 0 21 21" role="img" aria-label="QR code for the shared summary" shape-rendering="crispEdges" style="flex: none"><rect width="21" height="21" fill="#fff"></rect><path fill="#10292C" d="M0 0h7v7H0zM14 0h7v7h-7zM0 14h7v7H0z"></path><path fill="#fff" d="M1 1h5v5H1zM15 1h5v5h-5zM1 15h5v5H1z"></path><path fill="#10292C" d="M2 2h3v3H2zM16 2h3v3h-3zM2 16h3v3H2zM8 0h1v2H8zM10 1h2v1h-2zM9 3h2v2H9zM12 4h1v3h-1zM8 6h2v1H8zM0 8h2v1H0zM3 8h3v1H3zM8 8h3v2H8zM13 8h2v1h-2zM17 8h4v1h-4zM1 10h2v2H1zM5 10h2v1H5zM11 11h3v1h-3zM16 10h2v3h-2zM19 11h2v1h-2zM8 12h2v2H8zM14 13h1v2h-1zM9 15h3v1H9zM16 14h3v2h-3zM8 17h2v1H8zM12 17h2v3h-2zM15 18h3v1h-3zM19 17h2v4h-2zM9 19h2v2H9zM16 20h2v1h-2z"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="align-self: flex-start; padding: 5px 10px; border-radius: 999px; background: #FDF0E1; color: #8A4209; font-size: 12px; font-weight: 700">Expires in 28:41</span>
      <span style="font-size: 13px; color: #4B6164">Access code to say aloud</span>
      <strong style="font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 26px; letter-spacing: 0.12em">4 8 1 9</strong>
      <span style="font-size: 12px; color: #4B6164">Read-only · opens in any browser</span>
    </div>
  </div>
  <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
    <legend style="font-size: 14px; font-weight: 700; margin-bottom: 8px">What the doctor can see</legend>
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="4">
      <label style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D4DFDD; font-size: 15px; font-weight: 600">
        {{s.label}}
        <input type="checkbox" checked="{{s.on}}" onChange="{{s.toggle}}" style="width: 22px; height: 22px; accent-color: #0B6E69">
      </label>
    </sc-for>
  </fieldset>
  <div style="display: flex; flex-direction: column; gap: 5px"><label for="sh-dur" style="font-size: 14px; font-weight: 700">Link lasts</label><select id="sh-dur" style="height: 48px; border: 1.5px solid #C5D3D1; border-radius: 12px; padding: 0 12px; font: inherit; font-size: 15px; background: #FFFFFF"><option>30 minutes</option><option>2 hours</option><option>24 hours</option></select></div>
  <div style="font-size: 13px; color: #4B6164; display: flex; justify-content: space-between"><span>Access log: opened 1× today, 9:31 AM</span><a href="MDoctorView.dc.html" style="font-weight: 600">Preview</a></div>
  <div style="flex-grow: 1"></div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button type="button" style="height: 52px; border-radius: 14px; border: 1.5px solid #B4540F; background: #FFFFFF; color: #8A4209; font: inherit; font-weight: 700; font-size: 15px">Revoke link</button>
    <button type="button" style="height: 52px; border-radius: 14px; border: 0; background: #0B6E69; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 15px">New QR</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { meds: true, allergies: true, labs: true, dx: false };
  }
  renderVals() {
    const items = [['meds', 'Medications'], ['allergies', 'Allergies'], ['labs', 'Latest lab values'], ['dx', 'Diagnoses']];
    return {
      sections: items.map(([k, label]) => ({ label, on: this.state[k], toggle: () => this.setState({ [k]: !this.state[k] }) }))
    };
  }
}
</script>
</body>
</html>
