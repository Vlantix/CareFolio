<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CareFolio — Email OTP (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Schibsted+Grotesk:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6E69}a:hover{color:#08524E}
@keyframes cf-enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cf-enter{animation:cf-enter .4s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){.cf-enter{animation:none}}
</style>
</helmet>
<div class="cf-enter" style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6F5; font-family: 'Figtree', system-ui, sans-serif; color: #10292C; padding: 24px 24px 32px; display: flex; flex-direction: column; gap: 24px">
  <a href="Main.dc.html" aria-label="Back to log in" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D4DFDD; display: flex; align-items: center; justify-content: center; color: #10292C">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
  </a>
  <span style="font-size: 13px; font-weight: 600; color: #4B6164; letter-spacing: 0.04em; text-transform: uppercase">Step 2 of 2 · Email verification</span>
  <span style="width: 64px; height: 64px; border-radius: 20px; background: #FDF0E1; color: #A9520F; display: flex; align-items: center; justify-content: center">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
  </span>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 30px; line-height: 1.15; letter-spacing: -0.02em">Check your email</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #4B6164">Enter the 6-digit code we sent to <strong style="color: #10292C">m••••@gmail.com</strong></p>
  </div>
  <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
    <legend style="font-size: 14px; font-weight: 600; margin-bottom: 10px">Verification code</legend>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
      <input aria-label="Digit 1" inputmode="numeric" maxlength="1" value="4" style="height: 60px; min-width: 0; box-sizing: border-box; text-align: center; font: inherit; font-size: 24px; font-weight: 700; border: 1.5px solid #0B6E69; border-radius: 12px; background: #FFFFFF; color: #10292C">
      <input aria-label="Digit 2" inputmode="numeric" maxlength="1" value="8" style="height: 60px; min-width: 0; box-sizing: border-box; text-align: center; font: inherit; font-size: 24px; font-weight: 700; border: 1.5px solid #0B6E69; border-radius: 12px; background: #FFFFFF; color: #10292C">
      <input aria-label="Digit 3" inputmode="numeric" maxlength="1" value="2" style="height: 60px; min-width: 0; box-sizing: border-box; text-align: center; font: inherit; font-size: 24px; font-weight: 700; border: 1.5px solid #0B6E69; border-radius: 12px; background: #FFFFFF; color: #10292C">
      <input aria-label="Digit 4" inputmode="numeric" maxlength="1" style="height: 60px; min-width: 0; box-sizing: border-box; text-align: center; font: inherit; font-size: 24px; font-weight: 700; border: 2.5px solid #C2611A; border-radius: 12px; background: #FFFFFF; color: #10292C">
      <input aria-label="Digit 5" inputmode="numeric" maxlength="1" style="height: 60px; min-width: 0; box-sizing: border-box; text-align: center; font: inherit; font-size: 24px; font-weight: 700; border: 1.5px solid #C5D3D1; border-radius: 12px; background: #FFFFFF; color: #10292C">
      <input aria-label="Digit 6" inputmode="numeric" maxlength="1" style="height: 60px; min-width: 0; box-sizing: border-box; text-align: center; font: inherit; font-size: 24px; font-weight: 700; border: 1.5px solid #C5D3D1; border-radius: 12px; background: #FFFFFF; color: #10292C">
    </div>
    <p style="margin: 0; font-size: 14px; color: #4B6164">Didn't get it? Resend available in <strong style="color: #10292C">0:42</strong></p>
  </fieldset>
  <div style="flex-grow: 1"></div>
  <a href="Loading.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #0B6E69; color: #FFFFFF; font-weight: 600; font-size: 17px; text-decoration: none">Verify code</a>
  <a href="Main.dc.html" style="text-align: center; font-weight: 600; font-size: 15px; padding: 8px">Wrong email? Log in again</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
