<!doctype html>

<head>
<meta charset="utf-8">
<title>CareFolio — Request a correction</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Schibsted+Grotesk:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6E69}a:hover{color:#08524E}
@keyframes cf-enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cf-enter{animation:cf-enter .4s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){.cf-enter{animation:none}}
</style>
</helmet>
<div class="cf-enter" style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6F5; font-family: 'Figtree', system-ui, sans-serif; color: #10292C; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="MRequests.dc.html" aria-label="Back to requests" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D4DFDD; display: flex; align-items: center; justify-content: center; color: #10292C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 22px">Request a correction</h1>
  </div>
  <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4B6164">You can't edit records yourself — that keeps them official. Tell the records office what's wrong and they'll review it.</p>
  <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
    <legend style="font-size: 14px; font-weight: 700; margin-bottom: 8px">What's the problem?</legend>
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; background: #E3F1EF; border: 2px solid #0B6E69; font-weight: 600"><input type="radio" name="kind" checked style="width: 18px; height: 18px; accent-color: #0B6E69; margin: 0">A value or detail is wrong</label>
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D4DFDD; font-weight: 600"><input type="radio" name="kind" style="width: 18px; height: 18px; accent-color: #0B6E69; margin: 0">A record is missing</label>
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D4DFDD; font-weight: 600"><input type="radio" name="kind" style="width: 18px; height: 18px; accent-color: #0B6E69; margin: 0">Medication list is outdated</label>
  </fieldset>
  <div style="display: flex; flex-direction: column; gap: 5px"><label for="cr-rec" style="font-size: 14px; font-weight: 700">Which record?</label><select id="cr-rec" style="height: 48px; border: 1.5px solid #C5D3D1; border-radius: 12px; padding: 0 12px; font: inherit; font-size: 15px; background: #FFFFFF"><option>Medical abstract · Oct 10, 2026</option><option>Lab result — Creatinine · Oct 2</option></select></div>
  <div style="display: flex; flex-direction: column; gap: 5px"><label for="cr-det" style="font-size: 14px; font-weight: 700">Details</label><textarea id="cr-det" rows="4" placeholder="e.g. Allergy listed as penicillin, but it should be sulfa drugs." style="border: 1.5px solid #C5D3D1; border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 15px; background: #FFFFFF; resize: none"></textarea></div>
  <div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D4DFDD; font-size: 13px; color: #4B6164; line-height: 1.45">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6E69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
    Any change is made by the records office and saved in the audit trail. You'll be notified of the result.
  </div>
  <div style="flex-grow: 1"></div>
  <a href="MRequests.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #0B6E69; color: #FFFFFF; font-weight: 600; font-size: 17px; text-decoration: none">Send to records office</a>
</div>
</x-dc>

</html>
